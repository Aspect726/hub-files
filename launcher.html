<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THE HUB OF GAMES — V4.0</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #08050f;
      --sf: rgba(18, 10, 36, 0.48);
      --bd-glass: rgba(255, 255, 255, 0.1);
      --tx: #f2eef8;
      --tx3: #6e6488;
      --a1: #a855f7;
      --gd-btn: linear-gradient(135deg, #7c5cfc 0%, #a855f7 50%, #3b82f6 100%);
      --gw-strong: 0 8px 40px rgba(124, 92, 252, 0.18), 0 0 80px rgba(59, 130, 246, 0.1);
      --blur: blur(32px);
      --font: 'Outfit', sans-serif;
      --mono: 'JetBrains Mono', monospace
    }

    *,
    ::after,
    ::before {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden
    }

    .bg-video {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: .4
    }

    .login-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1
    }

    .login-bg .lo1 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #7c5cfc;
      filter: blur(80px);
      opacity: .15;
      top: -10%;
      left: -8%;
      animation: orb-f 20s ease-in-out infinite alternate
    }

    .login-bg .lo2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: #a855f7;
      filter: blur(80px);
      opacity: .15;
      bottom: -10%;
      right: -6%;
      animation: orb-f 25s ease-in-out infinite alternate-reverse
    }

    @keyframes orb-f {
      0% {
        transform: translate(0, 0) scale(1)
      }

      33% {
        transform: translate(40px, -35px) scale(1.08)
      }

      66% {
        transform: translate(-25px, 25px) scale(.94)
      }

      100% {
        transform: translate(35px, 15px) scale(1.04)
      }
    }

    .login-card {
      position: relative;
      z-index: 2;
      background: var(--sf);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--bd-glass);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: var(--gw-strong);
      animation: login-rise .6s cubic-bezier(0.34, 1.56, 0.64, 1)
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, .08) 0, transparent 40%);
      pointer-events: none
    }

    @keyframes login-rise {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.92)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    .login-logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #a855f7, #b47aff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }

    .login-ver {
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--tx3);
      letter-spacing: 2px;
      margin-bottom: 28px
    }

    .login-field {
      position: relative;
      margin-bottom: 14px
    }

    .login-field input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--tx);
      padding: 13px 16px 13px 42px;
      border-radius: 12px;
      font-family: var(--font);
      font-size: .88rem;
      outline: 0;
      transition: all .2s
    }

    .login-field input:focus {
      border-color: var(--a1);
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.12)
    }

    .login-field input::placeholder {
      color: var(--tx3)
    }

    .login-field .li {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .9rem;
      opacity: .4
    }

    .login-btn {
      width: 100%;
      background: var(--gd-btn);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-family: var(--font);
      font-weight: 700;
      font-size: .92rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(139, 92, 246, .3);
      transition: all .25s;
      margin-top: 6px
    }

    .login-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 6px 28px rgba(139, 92, 246, .4)
    }

    .login-btn:active {
      transform: scale(0.95)
    }

    .login-btn.loading {
      opacity: .6;
      pointer-events: none
    }

    .login-btn.success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 4px 20px rgba(34, 197, 94, .3)
    }

    .login-err {
      background: rgba(244, 63, 94, .1);
      color: #f43f5e;
      border: 1px solid rgba(244, 63, 94, .15);
      padding: 10px;
      border-radius: 8px;
      font-size: .78rem;
      margin-top: 12px;
      display: none
    }

    .login-err.visible {
      display: block
    }

    .login-foot {
      margin-top: 20px;
      font-size: .65rem;
      color: var(--tx3)
    }

    .login-spin {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, .2);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .login-status {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--tx3);
      margin-top: 12px;
      display: none
    }

    .login-status.visible {
      display: block
    }
  </style>
</head>

<body>
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="https://cdn.statically.io/gh/Aspect726/hub-files/main/background.mov" type="video/quicktime">
    <source src="https://cdn.statically.io/gh/Aspect726/hub-files/main/background.mov" type="video/mp4">
  </video>
  <div class="login-bg">
    <div class="lo1"></div>
    <div class="lo2"></div>
  </div>
  <div class="login-card">
    <div class="login-logo">THE HUB</div>
    <div class="login-ver">V4.0 — SECURE ACCESS</div>
    <div class="login-field"><span class="li">📧</span><input type="email" id="loginEmail" placeholder="Email"
        autocomplete="email"></div>
    <div class="login-field"><span class="li">🔒</span><input type="password" id="loginPass" placeholder="Password">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-status" id="loginStatus"></div>
    <div class="login-foot">Authorized access only</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDOVPrAzcCtMBqqtd5Vej_6UoR5k3Acibo",
      authDomain: "the-hub-database.firebaseapp.com",
      databaseURL: "https://the-hub-database-default-rtdb.firebaseio.com",
      projectId: "the-hub-database",
      storageBucket: "the-hub-database.firebasestorage.app",
      messagingSenderId: "181160902220",
      appId: "1:181160902220:web:4b5f8a217e11ea2faebee9"
    });

    (function () {
      try {
        var saved = localStorage.getItem("hub_saved_email");
        if (saved) {
          document.getElementById("loginEmail").value = saved;
          document.getElementById("loginPass").focus();
        }
      } catch (e) { }
    })();

    document.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin() });

    function showErr(msg) { var e = document.getElementById("loginErr"); e.textContent = msg; e.classList.add("visible") }
    function hideErr() { document.getElementById("loginErr").classList.remove("visible") }
    function showStatus(msg) { var s = document.getElementById("loginStatus"); s.textContent = msg; s.classList.add("visible") }
    function hideStatus() { document.getElementById("loginStatus").classList.remove("visible") }

    /* Glassmorphism loading page for the hub tab */
    function buildLoadingPage() {
      return '<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08050f;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Outfit",sans-serif}.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.15;pointer-events:none}.o1{width:500px;height:500px;background:#7c5cfc;top:-10%;left:-8%;animation:of 20s ease-in-out infinite alternate}.o2{width:400px;height:400px;background:#a855f7;bottom:-10%;right:-6%;animation:of 25s ease-in-out infinite alternate-reverse}@keyframes of{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.06)}100%{transform:translate(-15px,15px) scale(.96)}}.card{background:rgba(18,10,36,0.55);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:48px 56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;box-shadow:0 8px 40px rgba(124,92,252,0.18);position:relative;z-index:2}.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.08) 0,transparent 40%);pointer-events:none}.ring{width:52px;height:52px;border:3px solid rgba(255,255,255,.06);border-radius:50%;border-top-color:#7c5cfc;border-right-color:#b47aff;animation:sp .85s cubic-bezier(.68,-.3,.27,1.2) infinite}@keyframes sp{to{transform:rotate(360deg)}}.title{font-size:1.6rem;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#a855f7,#b47aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.sub{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:#6e6488;letter-spacing:1px}.bar-wrap{width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:4px}.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#7c5cfc,#b47aff,#38bdf8);border-radius:2px;animation:load 4s ease-out forwards}@keyframes load{0%{width:0%}30%{width:40%}60%{width:65%}80%{width:80%}100%{width:95%}}.pct{font-family:"JetBrains Mono",monospace;font-size:.62rem;color:#6e6488}</style></head><body><div class="orb o1"></div><div class="orb o2"></div><div class="card"><div class="ring"></div><div class="title">THE HUB</div><div class="sub">Downloading hub...</div><div class="bar-wrap"><div class="bar-fill" id="lbar"></div></div><div class="pct" id="lpct">0%</div></div></body></html>';
    }

    async function doLogin() {
      var email = document.getElementById("loginEmail").value.trim();
      var pass = document.getElementById("loginPass").value;
      var btn = document.getElementById("loginBtn");
      hideErr(); hideStatus();
      if (!email || !pass) { showErr("Enter email and password"); return }

      var w = window.open("", "_blank");
      if (!w) {
        showErr("Pop-up blocked! Allow pop-ups for this site and try again.");
        return;
      }
      /* Write glassmorphism loading screen immediately */
      w.document.open();
      w.document.write(buildLoadingPage());
      w.document.close();

      btn.innerHTML = '<span class="login-spin"></span>Signing in...'; btn.classList.add("loading");

      /* Helper to update the loading bar in the new tab */
      function setProgress(pct, label) {
        try {
          var bar = w.document.getElementById("lbar");
          var txt = w.document.getElementById("lpct");
          var sub = w.document.querySelector(".sub");
          if (bar) bar.style.cssText = "width:" + pct + "%;animation:none;transition:width .4s ease";
          if (txt) txt.textContent = pct + "%";
          if (sub && label) sub.textContent = label;
        } catch (e) { }
      }

      try {
        setProgress(10, "Authenticating...");
        showStatus("Authenticating...");
        var cred = await firebase.auth().signInWithEmailAndPassword(email, pass);

        try { localStorage.setItem("hub_saved_email", email); } catch (e) { }

        setProgress(25, "Fetching hub location...");
        showStatus("Fetching hub location...");
        var snap = await firebase.database().ref("hubCode").once("value");
        var hubUrl = snap.val();
        if (!hubUrl || typeof hubUrl !== "string" || hubUrl.length < 10) {
          throw new Error("Hub URL not found in database");
        }

        setProgress(50, "Downloading hub...");
        showStatus("Downloading hub...");
        var resp = await fetch(hubUrl);
        if (!resp.ok) throw new Error("Failed to download hub: " + resp.status);
        var html = await resp.text();
        if (!html || html.length < 100) throw new Error("Hub code is empty");

        setProgress(80, "Preparing hub...");

        /* Get Firebase ID token (secure, expires in 1hr, can't derive password) */
        var idToken = await firebase.auth().currentUser.getIdToken(true);
        var uid = firebase.auth().currentUser.uid;

        /* Inject auth with token instead of password */
        var authScript = '<script>window.__HUB_AUTH__={email:"' + email.replace(/"/g, '\\"') + '",token:"' + idToken + '",uid:"' + uid + '"};<\/script>';
        if (html.indexOf("<head") > -1) {
          html = html.replace(/(<head[^>]*>)/i, "$1\n" + authScript);
        } else {
          html = authScript + "\n" + html;
        }

        setProgress(95, "Launching...");
        showStatus("Launching hub...");
        w.document.open();
        w.document.write(html);
        w.document.close();

        btn.innerHTML = "✅ Hub Launched!"; btn.classList.remove("loading"); btn.classList.add("success");
        showStatus("Hub opened! You can close this tab.");
        setTimeout(function () { try { window.close() } catch (e) { } }, 1500);

      } catch (e) {
        try { w.close() } catch (ex) { }
        var msg = e.message || "Login failed";
        if (e.code === "auth/user-not-found" || e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Invalid email or password";
        else if (e.code === "auth/invalid-email") msg = "Invalid email address";
        else if (e.code === "auth/too-many-requests") msg = "Too many attempts. Try again later.";
        showErr(msg);
        btn.innerHTML = "Sign In"; btn.classList.remove("loading");
        hideStatus();
      }
    }
  </script>
</body>

</html>
